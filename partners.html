<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partners — Clutcher.io</title>
<link rel="icon" href="favicon.ico">
<style>
  html, body { margin: 0; min-height: 100%; background: #212121; color: #fff; }
  body { font-family: "Arial Rounded MT Bold", "Helvetica Rounded", "Nunito", "Trebuchet MS", Arial, sans-serif;
         font-weight: 700; text-align: center; padding: 40px 16px 60px; box-sizing: border-box; }
  h1 { display: inline-block; margin: 0; padding: 10px 32px 12px; background: #3d3d3d;
       font-size: 50px; line-height: 1.05; font-weight: 900; letter-spacing: 0.5px;
       text-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  .lead { margin: 22px 0 0; font-size: 14px; line-height: 1.3; text-shadow: 0 1px 0 rgba(0,0,0,0.5); }
  /* one partner = one <a class="partner"> holding a logo; they stack down the page */
  .partners { margin: 56px auto 0; display: flex; flex-direction: column; align-items: center; gap: 56px; }
  .partner img { display: block; max-width: 260px; max-height: 260px; height: auto; }
  @media (max-width: 480px) { h1 { font-size: 38px; padding: 8px 22px 10px; } }
</style>
</head>
<body>
  <h1>Partners</h1>
  <p class="lead">If you like this game,<br>check out some of our partners!</p>

  <div class="partners">
    <!-- PARTNERS GO HERE, one block each, top to bottom. Example:
    <a class="partner" href="https://example.com" target="_blank" rel="noopener">
      <img src="ui/partners/example.png" alt="Example">
    </a>
    -->
  </div>
</body>
</html>
